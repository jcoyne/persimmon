[package]
name = "persimmon"
version = "0.1.0"
edition = "2024"
# The j2k crate needs Rust 1.99 or newer.
rust-version = "1.99"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
bytes = "1"
futures = "0.3"
hex = "0.4"
# Not yet on crates.io, where the name belongs to an older, unrelated crate.
honeybadger = { git = "https://github.com/honeybadger-io/honeybadger-rust", rev = "5d4d3103989d292f56f78de711d0798d875e190f", optional = true }
http = "1"
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "jpeg", "png", "webp", "pnm"] }
# Unreleased fixes from the main branch.
j2k = { git = "https://github.com/frames-sg/j2k", rev = "17efbb51c71cd50a7e1af0bb82ca9c5ba565075c" }
jxl-oxide = { version = "0.12", default-features = false }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zune-core = "0.5"
zune-jpegxl = "0.5"

[features]
# Reports server errors and panics to Honeybadger when HONEYBADGER_API_KEY is set.
honeybadger = ["dep:honeybadger", "honeybadger/tokio"]

[dev-dependencies]
tempfile = "3"
